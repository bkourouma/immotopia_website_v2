# Intégration continue du site vitrine ImmoTopia, posée par acc-standard (seed :
# propriété du projet après création), adaptée le 2026-09-27 puis le 2026-10-13, puis le 2026-10-23 (tests).
# Aucun secret : les routes API lisent OPENROUTER_* et N8N_WEBHOOK_URL à
# l'exécution, le build n'en a pas besoin. Tests unitaires légers (node --test, sans
# dépendance : consentement GA4, bandeau, politique de confidentialité), puis types, lint,
# contrôle du comparatif et build.
#
# Ce workflow tourne sur chaque pull request, et il est aussi appelé par
# deploy.yml (workflow_call) à chaque poussée sur main : les vérifications
# passent donc toujours avant un déploiement, sans être jouées deux fois.
name: CI

on:
  pull_request:
  workflow_call:

# Une PR mise à jour annule sa vérification précédente. Appelé par deploy.yml,
# le workflow ne s'annule jamais (la concurrence du déploiement s'en charge).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Même version majeure que l'image de production (Dockerfile : node:24-alpine).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # « npm install » plutôt que « npm ci » : le lockfile généré sous Windows
      # omet des dépendances optionnelles Linux (voir Dockerfile).
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      # Sur un checkout neuf, tsc échoue sans ces deux fichiers générés (ignorés
      # par git) : knowledge.generated.ts (importé par le prompt de l'assistant)
      # et les types de routes de Next 16 (PageProps, LayoutProps, next-env.d.ts).
      - name: Générer la base de connaissances et les types de routes
        run: |
          node scripts/build-knowledge.mjs
          npx next typegen

      - name: Tests unitaires
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Traduction du comparatif
        run: node scripts/check-comparatif-en.mjs

      # prebuild génère src/lib/assistant/knowledge.generated.ts
      - name: Build
        run: npm run build
