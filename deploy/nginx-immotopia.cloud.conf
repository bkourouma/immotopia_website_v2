# Nginx Configuration for immotopia.cloud — site vitrine Next.js (septembre 2026)
# Ancienne configuration (site Astro) sauvegardée : /etc/nginx/backup/immotopia.cloud.astro.conf
# Production configuration with canonical URL enforcement
# Deploy to: /etc/nginx/sites-available/immotopia.cloud

# Site vitrine Next.js (conteneur Docker « immotopia-site »)
upstream immotopia_site {
    server 127.0.0.1:3023;
    keepalive 32;
}

# ============================================================================
# HTTP Server - Force HTTPS Redirect (301)
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name immotopia.cloud www.immotopia.cloud;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all HTTP to HTTPS with canonical URL (single hop)
    # This preserves the exact path including trailing slash state
    location / {
        return 301 https://immotopia.cloud$request_uri;
    }
}

# ============================================================================
# WWW Redirect Server - Redirect www to non-www
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.immotopia.cloud;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/immotopia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immotopia.cloud/privkey.pem;

    # Redirect www to non-www (301)
    return 301 https://immotopia.cloud$request_uri;
}

# ============================================================================
# HTTPS Server - Main Site (Canonical)
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name immotopia.cloud;

    # ========================================================================
    # SSL Configuration
    # ========================================================================
    ssl_certificate /etc/letsencrypt/live/immotopia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immotopia.cloud/privkey.pem;

    # SSL Protocols and Ciphers (Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/immotopia.cloud/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ========================================================================
    # Security Headers
    # ========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ========================================================================
    # Logging
    # ========================================================================
    access_log /var/log/nginx/immotopia-access.log;
    error_log /var/log/nginx/immotopia-error.log;

    # ========================================================================
    # Performance: Gzip Compression
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/rss+xml image/svg+xml;
    gzip_min_length 1000;

    client_max_body_size 2M;

    # URL canonique : pas de barre oblique finale (sauf la racine)
    location ~ ^(?!/_next/)(.+)/$ {
        return 301 https://immotopia.cloud$1;
    }

    # Tout le reste est servi par l'application Next.js (pages, redirections 301, sitemap, robots, API)
    location / {
        proxy_pass http://immotopia_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Fichiers cachés interdits
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
