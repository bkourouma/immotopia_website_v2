# Nginx Configuration for immotopia.cloud
# Production configuration with canonical URL enforcement
# Deploy to: /etc/nginx/sites-available/immotopia.cloud

# Upstream for Fastify API
upstream immotopia_api {
    server 127.0.0.1:3002;
    keepalive 64;
}

# Upstream for Astro public site (if using SSR, otherwise static files)
# For static Astro build, we serve from filesystem directly

# ============================================================================
# HTTP Server - Force HTTPS Redirect (301)
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name immotopia.cloud www.immotopia.cloud;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all HTTP to HTTPS with canonical URL (single hop)
    # This preserves the exact path including trailing slash state
    location / {
        return 301 https://immotopia.cloud$request_uri;
    }
}

# ============================================================================
# WWW Redirect Server - Redirect www to non-www
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.immotopia.cloud;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/immotopia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immotopia.cloud/privkey.pem;

    # Redirect www to non-www (301)
    return 301 https://immotopia.cloud$request_uri;
}

# ============================================================================
# HTTPS Server - Main Site (Canonical)
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name immotopia.cloud;

    # ========================================================================
    # SSL Configuration
    # ========================================================================
    ssl_certificate /etc/letsencrypt/live/immotopia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immotopia.cloud/privkey.pem;

    # SSL Protocols and Ciphers (Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/immotopia.cloud/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ========================================================================
    # Security Headers
    # ========================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ========================================================================
    # Logging
    # ========================================================================
    access_log /var/log/nginx/immotopia-access.log;
    error_log /var/log/nginx/immotopia-error.log;

    # ========================================================================
    # Performance: Gzip Compression
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # ========================================================================
    # Client Limits
    # ========================================================================
    client_max_body_size 10M;

    # ========================================================================
    # CANONICAL URL ENFORCEMENT: Trailing Slash Normalization
    # ========================================================================
    # Policy: NO trailing slash (except root "/")
    # This works in conjunction with Astro trailingSlash: 'never'
    #
    # Handle trailing slash redirects:
    # - Redirect /path/ → /path (301)
    # - Exception: root path "/" is allowed
    #
    # This location block must come BEFORE other location blocks to match first

    # Remove trailing slash from all URLs except root
    # Use regex to match any URL ending with / but not root
    location ~ ^(?!/api/)(.+)/$ {
        return 301 https://immotopia.cloud$1;
    }

    # ========================================================================
    # API Proxy - Forward to Fastify (Port 3004)
    # ========================================================================
    location /api/ {
        proxy_pass http://immotopia_api;
        proxy_http_version 1.1;

        # Headers for proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cache control
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ========================================================================
    # SEO Files: robots.txt, sitemap.xml (critical for indexing)
    # ========================================================================
    location = /robots.txt {
        root /var/www/immotopia-app/apps/public-site/dist;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=3600"; # 1 hour cache
    }

    location = /sitemap.xml {
        root /var/www/immotopia-app/apps/public-site/dist;
        access_log off;
        add_header Cache-Control "public, max-age=3600"; # 1 hour cache
        add_header Content-Type "application/xml";
    }

    # ========================================================================
    # Static Assets Caching
    # ========================================================================
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        root /var/www/immotopia-app/apps/public-site/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location ~* \.(css|js|woff|woff2|ttf|eot|otf)$ {
        root /var/www/immotopia-app/apps/public-site/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========================================================================
    # Public Site - Astro Static Files
    # ========================================================================
    location / {
        root /var/www/immotopia-app/apps/public-site/dist;
        index index.html;
        # Astro with format: 'file' generates /path.html files
        # Try: exact URI, URI with .html extension, then fallback to index.html
        try_files $uri $uri.html /index.html;

        # HTML file caching (short TTL for content updates)
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # ========================================================================
    # Security: Deny Access to Hidden Files
    # ========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ========================================================================
    # Favicon
    # ========================================================================
    location = /favicon.ico {
        root /var/www/immotopia-app/apps/public-site/dist;
        log_not_found off;
        access_log off;
        expires 1M;
    }
}
