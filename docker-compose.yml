services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_BOOKING_URL: ${NEXT_PUBLIC_BOOKING_URL:-https://calendly.com/immotopia/consultation-alliance-computer-consultants}
    image: immotopia-site:latest
    container_name: immotopia-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:3023:3000"
    environment:
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      MC_SEO_BUSINESS_SOURCE_ID: ${MC_SEO_BUSINESS_SOURCE_ID:-}
      MC_SEO_BUSINESS_TOKEN: ${MC_SEO_BUSINESS_TOKEN:-}
      MC_SEO_BUSINESS_OUTBOX_DIR: /app/data/seo-business-outbox
      MC_SEO_REGISTRATION_SOURCE_ID: ${MC_SEO_REGISTRATION_SOURCE_ID:-}
      MC_SEO_REGISTRATION_TOKEN: ${MC_SEO_REGISTRATION_TOKEN:-}
      MC_SEO_REGISTRATION_OUTBOX_DIR: /app/data/seo-business-outbox/registrations
      # Assistant immotopIA (clé à placer dans /var/www/immotopia-site/.env, jamais dans le code)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      # Module Événements : base SQLite sur le volume, administration et e-mails (secrets dans le .env du serveur)
      EVENTS_DB_PATH: /app/data/events.db
      EVENTS_ADMIN_PASSWORD: ${EVENTS_ADMIN_PASSWORD:-}
      EVENTS_ADMIN_SECRET: ${EVENTS_ADMIN_SECRET:-}
      EVENTS_SMTP_HOST: ${EVENTS_SMTP_HOST:-}
      EVENTS_SMTP_PORT: ${EVENTS_SMTP_PORT:-465}
      EVENTS_SMTP_USER: ${EVENTS_SMTP_USER:-}
      EVENTS_SMTP_PASSWORD: ${EVENTS_SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EVENTS_EMAIL_FROM: ${EVENTS_EMAIL_FROM:-}
      EVENTS_EMAIL_REPLY_TO: ${EVENTS_EMAIL_REPLY_TO:-}
    volumes:
      - immotopia-events:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  immotopia-events:

